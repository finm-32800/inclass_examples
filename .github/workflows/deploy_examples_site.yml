name: Build and Deploy Examples Site

# Builds both subexamples under github_actions/ and publishes the combined
# site to GitHub Pages. See github_actions/README.md for the full walkthrough.
#
# Cron syntax reference:
# ┌───────────── minute (0-59)
# │ ┌───────────── hour (0-23, UTC — GitHub Actions cron always runs in UTC)
# │ │ ┌───────────── day of month (1-31)
# │ │ │ ┌───────────── month (1-12)
# │ │ │ │ ┌───────────── day of week (0-6, Sunday=0)
# │ │ │ │ │
# 0 10 * * *   -> every day at 10:00 UTC (4-5 AM Chicago)
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}  # manual "Run workflow" button / `gh workflow run`
  push:
    branches: [main]
    paths:
      - 'github_actions/**'
      - '.github/workflows/deploy_examples_site.yml'

# GITHUB_TOKEN needs write access to force-push the gh-pages branch.
# Declaring it here in YAML is portable — it works regardless of the
# repository's "default workflow permissions" setting.
permissions:
  contents: write

# Never let two deploys interleave their force-pushes (e.g., the daily cron
# racing a push to main). The newest run supersedes an in-flight one.
concurrency:
  group: deploy-examples-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: "America/Chicago"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Cache pip's wheel *download* cache only, keyed strictly on the
          # requirements files. Packages still resolve and install fresh every
          # run, so a stale cached virtualenv can never break the build.
          cache: 'pip'
          cache-dependency-path: |
            github_actions/01_fred_chartbook/requirements.txt
            github_actions/02_databento_secret/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r github_actions/01_fred_chartbook/requirements.txt
          pip install -r github_actions/02_databento_secret/requirements.txt

      - name: Build FRED chartbook (subexample 01)
        working-directory: github_actions/01_fred_chartbook
        run: doit

      - name: Build Databento price page (subexample 02)
        working-directory: github_actions/02_databento_secret
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: doit

      - name: Assemble site tree
        run: |
          SITE="$RUNNER_TEMP/site"          # staged OUTSIDE the repo checkout
          mkdir -p "$SITE/02_databento"
          cp github_actions/site/index.html "$SITE/index.html"
          cp -r github_actions/01_fred_chartbook/docs "$SITE/01_fred"
          cp github_actions/02_databento_secret/_output/index.html "$SITE/02_databento/index.html"
          # Tell GitHub Pages not to run Jekyll (it would drop _static/ etc.)
          touch "$SITE/.nojekyll"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages (single orphan commit, force-pushed)
        run: |
          # Orphan branch = no parent commits, so gh-pages always contains
          # exactly ONE commit no matter how many times this workflow runs.
          git checkout --orphan gh-pages
          git rm -rf --quiet .
          # git rm only removes *tracked* files; also purge untracked and
          # gitignored build leftovers (_data/, _output/, docs/) so nothing
          # from the build sneaks into the published site.
          git clean -fdx --quiet
          cp -r "$RUNNER_TEMP/site/." .
          git add -A
          git commit -m "Deploy examples site $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push --force origin gh-pages
