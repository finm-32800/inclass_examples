# pixi: a modern, fast environment manager (from the prefix.dev team)
# that installs from the SAME conda channels as conda, but with a uv-like
# workflow: a single manifest, an automatic per-project environment, and
# a lockfile (pixi.lock) committed for exact reproducibility.
#
#   pixi run start          # runs the `start` task defined below
#   pixi run python analyze.py   # or run anything inside the environment
#   pixi shell              # activate an interactive shell in the env
#
# pixi resolves conda packages by default (no separate `conda` install
# needed) and can also pull from PyPI via a [pypi-dependencies] table.
[project]
name = "finm-env-pixi"
version = "0.1.0"
description = "Moving-average crossover demo, managed by pixi"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.0"
pandas = ">=2.2"
matplotlib = ">=3.9"

[tasks]
start = "python analyze.py"
